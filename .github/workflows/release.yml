name: Build release binary

on:
  release:
    types: [published]
  # Rebuild the assets of an existing release from the branch picked in "Run workflow"
  # (not from the tag), replacing them. The app still shows the given tag as its version.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and replace the assets of, e.g. v1.4
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: polygraph-${{ github.event.release.tag_name || inputs.tag }}-windows.exe
          # Uncomment to also build for Linux Mint (Ubuntu-based).
          # - os: ubuntu-latest
          #   asset: polygraph-${{ github.event.release.tag_name || inputs.tag }}-linux
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ASSET: ${{ matrix.asset }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_app/requirements.txt

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r python_app/requirements.txt pyinstaller

      - name: Write version file
        shell: bash
        run: echo "VERSION = \"$TAG\"" > python_app/_version.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Console window is kept on purpose (shows errors); do not add --windowed.
          BASE="${ASSET%.exe}"
          # config.toml is bundled so the exe can write it next to itself on first launch.
          # polygraph.ico is the exe's file icon (--icon) and, bundled, the window icon.
          pyinstaller --onefile --name "$BASE" --icon python_app/polygraph.ico --paths python_app --add-data "python_app/config.toml:." --add-data "python_app/polygraph.ico:." python_app/main.py
          ls -l dist

      - name: Upload asset to release
        shell: bash
        run: gh release upload "$TAG" "dist/$ASSET" --clobber

  firmware:
    name: Package Arduino sketch
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Zip the sketch folder
        # Arduino needs the folder name to match the .ino, so the zip keeps polygraph/ as its top folder.
        run: |
          cd arduino
          zip -r "../polygraph-$TAG-arduino.zip" polygraph
          unzip -l "../polygraph-$TAG-arduino.zip"

      - name: Upload asset to release
        run: gh release upload "$TAG" "polygraph-$TAG-arduino.zip" --clobber
